kind = "web"
previewPath = "/"
title = "Sitio Web Jardinería"
version = "1.0.0"
id = "artifacts/jardineria"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22763

[services.development]
run = "pnpm --filter @workspace/jardineria run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jardineria", "run", "build" ]
publicDir = "artifacts/jardineria/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22763"
BASE_PATH = "/"
